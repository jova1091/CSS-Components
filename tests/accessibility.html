<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Components - Accessibility Audit</title>
  <style>
    body { max-width: 900px; margin: 2rem auto; padding: 0 1rem; font-family: system-ui, sans-serif; }
    h1 { margin-bottom: 0.25rem; }
    .info { color: #6c757d; margin-bottom: 1.5rem; }
    #audit-btn { margin: 1rem 0; }
    .page-result { margin: 1.5rem 0; border: 1px solid #dee2e6; border-radius: 8px; overflow: hidden; }
    .page-header { padding: 0.75rem 1rem; background: #f8f9fa; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    .badge { padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.8rem; }
    .badge.pass { background: #d4edda; color: #155724; }
    .badge.fail { background: #f8d7da; color: #721c24; }
    .violation { padding: 0.75rem 1rem; border-top: 1px solid #dee2e6; }
    .violation:last-child { border-bottom: none; }
    .violation h4 { margin: 0 0 0.25rem; font-size: 0.9rem; }
    .impact { display: inline-block; padding: 0.1rem 0.4rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; margin-right: 0.5rem; }
    .impact.critical { background: #721c24; color: #fff; }
    .impact.serious { background: #e74c3c; color: #fff; }
    .impact.moderate { background: #ffc107; color: #212529; }
    .impact.minor { background: #17a2b8; color: #fff; }
    .violation p { margin: 0.25rem 0; font-size: 0.85rem; color: #495057; }
    .violation .nodes { font-size: 0.8rem; color: #6c757d; }
    .violation code { background: #f1f1f1; padding: 0.1rem 0.3rem; border-radius: 3px; font-size: 0.8rem; }
    .no-violations { padding: 1rem; color: #27ae60; font-weight: 600; }
    .summary { font-size: 1.1rem; font-weight: 600; margin: 1rem 0; padding: 0.75rem 1rem; background: #f8f9fa; border-radius: 8px; display: none; }
  </style>
</head>
<body>
  <h1>Accessibility Audit</h1>
  <p class="info">Fetches each showcase page, strips scripts, and runs axe-core against the clean HTML structure.</p>
  <button id="audit-btn" class="btn btn-primary">Run A11y Audit</button>
  <div class="summary" id="summary"></div>
  <div id="results"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axe-core/4.9.1/axe.min.js"></script>
  <script src="audit.js"></script>
</body>
</html>
